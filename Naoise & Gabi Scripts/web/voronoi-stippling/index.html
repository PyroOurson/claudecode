<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voronoi Stippling</title>
<style>
:root{--bg:#fff;--fg:#1b1e23;--muted:#6b7280;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--fg:#e5e7eb;--muted:#9ca3af;--line:#2a2e37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 24px;padding:16px;border:1px solid var(--line);border-radius:10px;margin-bottom:20px}
label{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
label span{display:flex;justify-content:space-between}
input[type=range]{width:100%}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:none}
button{padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--fg);color:var(--bg);font-weight:600;cursor:pointer}
.buttons{display:flex;gap:8px;align-items:end}
canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line)}
#status{font-size:.85rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Voronoi Stippling</h1>
<p>Turn any picture into a dot drawing. Dots settle where the image is dark using weighted Lloyd relaxation.</p>
<div class="controls">
<label>Image<input type="file" id="file" accept="image/*"></label>
<label><span>Dots <output id="densityOut"></output></span><input type="range" id="density" min="0.2" max="5" step="0.1" value="1"></label>
<label><span>Min size <output id="minOut"></output></span><input type="range" id="min" min="0" max="1.5" step="0.05" value="0.3"></label>
<label><span>Max size <output id="maxOut"></output></span><input type="range" id="max" min="1.5" max="10" step="0.1" value="4.5"></label>
<label><span>Contrast <output id="gammaOut"></output></span><input type="range" id="gamma" min="0.2" max="10" step="0.1" value="2.5"></label>
<label>Background<input type="color" id="bg" value="#ffffff"></label>
<label>Dots colour<input type="color" id="fg" value="#000000"></label>
<div class="buttons"><button id="restart">Restart</button><button id="download">Download PNG</button></div>
</div>
<canvas id="canvas"></canvas>
<div id="status"></div>
</main>
<script type="module">
const workerSource=`
import {Delaunay} from "https://cdn.jsdelivr.net/npm/d3-delaunay@6/+esm";
let run=0;
onmessage=({data})=>{
  const id=++run;
  const {weights,width,height,n,iterations}=data;
  const points=new Float64Array(n*2);
  for(let i=0;i<n;i++){
    for(let tries=0;tries<30;tries++){
      const x=Math.floor(Math.random()*width),y=Math.floor(Math.random()*height);
      points[i*2]=x+Math.random();points[i*2+1]=y+Math.random();
      if(Math.random()<weights[y*width+x])break;
    }
  }
  const cx=new Float64Array(n),cy=new Float64Array(n),total=new Float64Array(n);
  const step=k=>{
    if(id!==run)return;
    cx.fill(0);cy.fill(0);total.fill(0);
    const delaunay=new Delaunay(points);
    let cell=0,maxTotal=0;
    for(let y=0;y<height;y++){
      for(let x=0;x<width;x++){
        const w=weights[y*width+x];
        if(w===0)continue;
        cell=delaunay.find(x+0.5,y+0.5,cell);
        cx[cell]+=w*(x+0.5);cy[cell]+=w*(y+0.5);total[cell]+=w;
      }
    }
    for(let i=0;i<n;i++)if(total[i]>maxTotal)maxTotal=total[i];
    const jitter=Math.pow(k+1,-0.8)*10;
    const strength=new Float64Array(n);
    for(let i=0;i<n;i++){
      const x0=points[i*2],y0=points[i*2+1];
      let x1,y1;
      if(total[i]>0){x1=cx[i]/total[i];y1=cy[i]/total[i]}else{x1=Math.random()*width;y1=Math.random()*height}
      points[i*2]=x0+(x1-x0)*1.8+(Math.random()-0.5)*jitter;
      points[i*2+1]=y0+(y1-y0)*1.8+(Math.random()-0.5)*jitter;
      strength[i]=Math.sqrt(total[i]/(maxTotal||1));
    }
    postMessage({points:points.slice(),strength,iteration:k+1},[strength.buffer]);
    if(k+1<iterations)setTimeout(()=>step(k+1),0);
  };
  step(0);
};`;
const workerUrl=URL.createObjectURL(new Blob([workerSource],{type:"text/javascript"}));

const $=id=>document.getElementById(id);
const canvas=$("canvas"),ctx=canvas.getContext("2d");
const inputs=["density","min","max","gamma"];
const ITERATIONS=80;
let image=null,width=0,height=0,points=null,strength=null,worker=null;

function sampleImage(){
  const c=document.createElement("canvas");
  c.width=c.height=600;
  const g=c.getContext("2d");
  const gradient=g.createRadialGradient(300,260,20,300,300,300);
  gradient.addColorStop(0,"#fff");gradient.addColorStop(1,"#000");
  g.fillStyle=gradient;g.fillRect(0,0,600,600);
  g.fillStyle="#000";g.font="bold 150px system-ui";g.textAlign="center";g.textBaseline="middle";g.fillText("HELLO",300,300);
  return c;
}

function computeWeights(){
  width=Math.round(Math.min(1000,canvas.parentElement.clientWidth));
  height=Math.round(width*image.height/image.width);
  const c=document.createElement("canvas");c.width=width;c.height=height;
  const g=c.getContext("2d");g.drawImage(image,0,0,width,height);
  const {data}=g.getImageData(0,0,width,height);
  const gamma=+$("gamma").value;
  const weights=new Float64Array(width*height);
  for(let i=0;i<weights.length;i++){
    const lum=(0.299*data[i*4]+0.587*data[i*4+1]+0.114*data[i*4+2])/255;
    weights[i]=Math.pow(Math.max(0,1-lum),gamma);
  }
  const dpr=window.devicePixelRatio||1;
  canvas.width=width*dpr;canvas.height=height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return weights;
}

function draw(){
  if(!points)return;
  const minR=+$("min").value,maxR=+$("max").value;
  ctx.fillStyle=$("bg").value;ctx.fillRect(0,0,width,height);
  ctx.fillStyle=$("fg").value;ctx.beginPath();
  for(let i=0;i<points.length/2;i++){
    const r=minR+(maxR-minR)*strength[i];
    if(r<=0)continue;
    const x=points[i*2],y=points[i*2+1];
    ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,2*Math.PI);
  }
  ctx.fill();
}

function start(){
  if(worker)worker.terminate();
  const weights=computeWeights();
  const n=Math.round(width*height/40*+$("density").value);
  points=null;
  worker=new Worker(workerUrl,{type:"module"});
  worker.onmessage=({data})=>{
    points=data.points;strength=data.strength;
    requestAnimationFrame(draw);
    $("status").textContent=`${n.toLocaleString()} dots · iteration ${data.iteration}/${ITERATIONS}`;
  };
  worker.onerror=()=>{$("status").textContent="Could not load the stippling library. Check your internet connection."};
  $("status").textContent=`${n.toLocaleString()} dots · starting...`;
  worker.postMessage({weights,width,height,n,iterations:ITERATIONS},[weights.buffer]);
}

function updateOutputs(){inputs.forEach(k=>$(k+"Out").textContent=$(k).value)}

$("file").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  const img=new Image();
  img.onload=()=>{image=img;start();URL.revokeObjectURL(img.src)};
  img.src=URL.createObjectURL(file);
});
inputs.forEach(k=>$(k).addEventListener("input",updateOutputs));
["density","gamma"].forEach(k=>$(k).addEventListener("change",start));
["min","max","bg","fg"].forEach(k=>$(k).addEventListener("input",draw));
$("restart").onclick=start;
$("download").onclick=()=>{const a=document.createElement("a");a.download="stipple.png";a.href=canvas.toDataURL("image/png");a.click()};
let resizeTimer;window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(Math.abs(canvas.parentElement.clientWidth-width)>50)start()},300)});

updateOutputs();
image=sampleImage();
start();
</script>
</body>
</html>
