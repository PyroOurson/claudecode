[package]
name = "maps-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bollard = "0.21.0"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = { version = "0.3.33", default-features = false }
osmpbf = "0.3.8"
rayon = "1.12.0"
rstar = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.7", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
urlencoding = "2.1.3"
