<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooldown Timer</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--fg:#f3f4f6;--muted:#9ca3af;--line:#2a2e37;--accent:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.card{width:100%;max-width:420px;text-align:center}
h1{margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
form{display:grid;gap:14px;text-align:left}
label{display:grid;gap:6px;font-size:.9rem}
input{padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;font-size:1rem;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button.secondary{background:none;color:var(--muted);border:1px solid var(--line)}
#timer{font-size:clamp(2.2rem,10vw,3.5rem);font-variant-numeric:tabular-nums;font-weight:700;margin:28px 0 6px}
#until{color:var(--muted);min-height:1.2em}
</style>
</head>
<body>
<div class="card">
<h1>Cooldown Timer</h1>
<p>Track when a usage limit, cooldown or quota resets.</p>
<form id="form">
<label>Name<input id="name" placeholder="Image generation" maxlength="60"></label>
<label>Cooldown started at<input type="datetime-local" id="start" required></label>
<div class="row">
<label>Hours<input type="number" id="hours" min="0" value="0" required></label>
<label>Minutes<input type="number" id="minutes" min="0" max="59" value="30" required></label>
</div>
<button type="submit">Start timer</button>
<button type="button" class="secondary" id="clear">Clear</button>
</form>
<div id="timer">--:--:--</div>
<div id="until"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY="cooldown-timer";
let interval;

function localInputValue(date){const d=new Date(date-date.getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)}
function read(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function write(v){try{v?localStorage.setItem(KEY,JSON.stringify(v)):localStorage.removeItem(KEY)}catch(e){}}

function notify(text){
  document.title="✅ "+text;
  if("Notification" in window&&Notification.permission==="granted")new Notification(text);
}

function tick(saved){
  const remaining=saved.end-Date.now();
  if(remaining<=0){
    clearInterval(interval);
    $("timer").textContent="Ready!";
    $("until").textContent=(saved.name||"It")+" is available again.";
    notify((saved.name||"Cooldown")+" is ready");
    write(null);
    return;
  }
  const s=Math.floor(remaining/1000);
  const text=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,"0")).join(":");
  $("timer").textContent=text;
  document.title=text+" · "+(saved.name||"Cooldown");
}

function run(saved){
  clearInterval(interval);
  $("until").textContent=(saved.name?saved.name+" resets":"Resets")+" at "+new Date(saved.end).toLocaleString([], {weekday:"short",hour:"2-digit",minute:"2-digit"});
  tick(saved);
  interval=setInterval(()=>tick(saved),1000);
}

$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const start=new Date($("start").value).getTime();
  const end=start+(+$("hours").value*3600+ +$("minutes").value*60)*1000;
  const saved={name:$("name").value.trim(),end};
  write(saved);
  if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
  run(saved);
});
$("clear").onclick=()=>{clearInterval(interval);write(null);$("timer").textContent="--:--:--";$("until").textContent="";document.title="Cooldown Timer"};

$("start").value=localInputValue(new Date());
const saved=read();
if(saved){$("name").value=saved.name||"";run(saved)}
</script>
</body>
</html>
