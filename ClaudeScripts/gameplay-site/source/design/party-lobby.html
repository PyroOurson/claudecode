<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Lobby</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one rounded card. Lavender header (game name centred, party code on the right), white body (players left, live chat right), lavender footer with the Play button. */
:root{
  --page:#ebe8f7; --card:#ffffff; --band:#f4f1ff; --line:#ece9f6;
  --fg:#17142b; --muted:#8a87a3; --accent:#7b3aed; --accent-ink:#ffffff; --accent-soft:#efe9ff;
  --danger:#e5384f; --danger-soft:#fdecef; --live:#16a561; --live-soft:#e8f8ef; --chip:#f0eff5;
  --shadow:0 24px 60px rgba(60,30,140,.18);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0f0d1c; --card:#1a1730; --band:#221e3d; --line:#2d2850;
  --fg:#f1efff; --muted:#9f9cc0; --accent:#8f5cf2; --accent-ink:#ffffff; --accent-soft:#2f2556;
  --danger:#ff6b80; --danger-soft:#3a1e2c; --live:#3ad596; --live-soft:#143328; --chip:#2a2548;
  --shadow:0 24px 60px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0f0d1c; --card:#1a1730; --band:#221e3d; --line:#2d2850;
  --fg:#f1efff; --muted:#9f9cc0; --accent:#8f5cf2; --accent-ink:#ffffff; --accent-soft:#2f2556;
  --danger:#ff6b80; --danger-soft:#3a1e2c; --live:#3ad596; --live-soft:#143328; --chip:#2a2548;
  --shadow:0 24px 60px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

.lobby{max-width:1040px;margin:0 auto;background:var(--card);border-radius:32px;box-shadow:var(--shadow);overflow:hidden}

/* header */
.head{background:var(--band);padding:36px 40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.head h1{grid-column:2;margin:0;font-size:46px;line-height:1.1;font-weight:800;letter-spacing:-.03em;text-align:center}
.code{grid-column:3;justify-self:end}
.code small{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--card);border-radius:16px;padding:14px 20px;min-width:230px}
.codebox b{font-size:28px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.hide{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600}
.hide svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* body */
.body{display:grid;grid-template-columns:minmax(0,1fr) 1px 330px;gap:0 40px;padding:36px 40px 40px}
.rule{background:var(--line)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.sec-h h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.pill{font-size:14px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:99px;padding:6px 14px;font-variant-numeric:tabular-nums}
.pill.live{color:var(--live);background:var(--live-soft);display:flex;align-items:center;gap:7px;padding:4px 12px}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live)}

.players{list-style:none;margin:0;padding:0}
.pl{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;display:grid;place-items:center;flex:none}
.pl.host .av{background:var(--accent);color:var(--accent-ink)}
.who{flex:1;min-width:0}
.who b{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.who>span{display:block;color:var(--muted);font-size:14px}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px 9px}
.sq{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;transition:transform .12s}
.sq:hover{transform:scale(1.08)}
.sq svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.crown{background:var(--accent-soft);color:var(--accent)}
.pl.host .crown{background:var(--accent);color:var(--accent-ink)}
.kick{background:var(--danger-soft);color:var(--danger)}

/* chat */
.chat{display:flex;flex-direction:column;min-width:0;min-height:520px}
.msgs{flex:1;display:flex;flex-direction:column;gap:18px;overflow-y:auto;padding-bottom:16px}
.m b{font-weight:700}
.m time{margin-left:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.m p{margin:3px 0 0;color:var(--muted);overflow-wrap:anywhere}
.send{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 18px;background:var(--card)}
.send:focus-within{border-color:var(--accent)}
.send input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--fg);height:36px}
.send input::placeholder{color:var(--muted)}
.go{width:42px;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* footer */
.foot{background:var(--band);padding:44px 40px;display:flex;justify-content:center}
.play{display:flex;align-items:center;justify-content:center;gap:10px;min-width:330px;height:62px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:700;box-shadow:0 12px 28px color-mix(in srgb,var(--accent) 38%,transparent);transition:transform .12s}
.play:hover{transform:translateY(-2px)}
.play svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--card);padding:11px 18px;border-radius:12px;font-weight:600}

@media (max-width:860px){
  .head{grid-template-columns:1fr;justify-items:center;padding:28px 20px}
  .head h1{grid-column:1;font-size:34px}
  .code{grid-column:1;justify-self:center;text-align:center}
  .body{grid-template-columns:minmax(0,1fr);gap:32px;padding:28px 20px}
  .rule{display:none}
  .chat{min-height:380px}
  .foot{padding:28px 20px}
  .play{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="lobby">
 <header class="head">
  <h1>Game Name</h1>
  <div class="code">
   <small>Party code</small>
   <div class="codebox">
    <b id="codeText">ABCD</b>
    <button class="hide" id="hide" aria-pressed="false">
     <svg viewBox="0 0 24 24" id="eye"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
     <span id="hideLbl">Hide</span>
    </button>
   </div>
  </div>
 </header>

 <div class="body">
  <section aria-label="Players">
   <div class="sec-h"><h2>Players</h2><span class="pill" id="joined">6 / 8 joined</span></div>
   <ul class="players" id="players"></ul>
  </section>
  <div class="rule"></div>
  <section class="chat" aria-label="Live chat">
   <div class="sec-h"><h2>Live chat</h2><span class="pill live">Live</span></div>
   <div class="msgs" id="msgs"></div>
   <form class="send" id="form">
    <input id="msg" placeholder="Type a message..." autocomplete="off" aria-label="Message">
    <button class="go" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
   </form>
  </section>
 </div>

 <footer class="foot">
  <button class="play" id="play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>Play</button>
 </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  function $(id){return document.getElementById(id)}
  var CROWN='<svg viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5zM5 21h14"/></svg>';
  var X='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  var P=[1,2,3,4,5,6], host=1, MAX=8;

  function renderPlayers(){
    $('players').innerHTML=P.map(function(n){
      var h=n===host;
      return '<li class="pl'+(h?' host':'')+'"><span class="av">P'+n+'</span>'+
        '<div class="who"><b>Player '+n+(h?' <span class="badge">HOST</span>':'')+'</b><span>'+(h?'Party leader · You':'Member')+'</span></div>'+
        '<button class="sq crown" data-crown="'+n+'" aria-label="Make Player '+n+' leader">'+CROWN+'</button>'+
        '<button class="sq kick" data-kick="'+n+'" aria-label="Remove Player '+n+'">'+X+'</button></li>'}).join('');
    $('joined').textContent=P.length+' / '+MAX+' joined'}
  $('players').onclick=function(e){
    var c=e.target.closest('[data-crown]'),k=e.target.closest('[data-kick]');
    if(c){host=+c.dataset.crown;renderPlayers()}
    if(k){var n=+k.dataset.kick;if(n!==host){P=P.filter(function(x){return x!==n});renderPlayers()}}};

  var M=[['Player 2','12:40','Hi everyone!'],['Player 1','12:40','Welcome! Just waiting for everyone to join.'],['Player 3','12:41',"I'm here. Ready when you are."],['Player 4','12:41',"All set. Let's play!"]];
  function esc(t){return t.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function renderMsgs(){
    $('msgs').innerHTML=M.map(function(m){return '<div class="m'+(m[0]==='Player 1'?' me':'')+'"><b>'+m[0]+'</b><time>'+m[1]+'</time><p>'+esc(m[2])+'</p></div>'}).join('');
    $('msgs').scrollTop=$('msgs').scrollHeight}
  $('form').onsubmit=function(e){e.preventDefault();var v=$('msg').value.trim();if(!v)return;
    var d=new Date(),t=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    M.push(['Player 1',t,v]);$('msg').value='';renderMsgs()};

  var hidden=false;
  $('hide').onclick=function(){hidden=!hidden;$('codeText').textContent=hidden?'••••':'ABCD';$('hideLbl').textContent=hidden?'Show':'Hide';this.setAttribute('aria-pressed',hidden);
    $('eye').innerHTML=hidden?'<path d="M3 3l18 18M10.6 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.5A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/>':'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'};
  $('play').onclick=function(){var t=$('toast');t.textContent='Starting the game with '+P.length+' players...';t.hidden=false;clearTimeout($('play').h);$('play').h=setTimeout(function(){t.hidden=true},2400)};
  renderPlayers();renderMsgs();
})();
</script>
</body>
</html>
