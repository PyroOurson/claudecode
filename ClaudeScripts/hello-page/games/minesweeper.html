<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common.css">
  <style>
    :root {
      --hid-a: #aad751;
      --hid-b: #a2d149;
      --hid-hover: #c3e57f;
      --open-a: #e8cba9;
      --open-b: #dcbd98;
      --n1: #1565c0;
      --n2: #2e7d32;
      --n3: #d32f2f;
      --n4: #6a1b9a;
      --n5: #c25e00;
      --n6: #00838f;
      --n7: #303030;
      --n8: #757575;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --hid-a: #4b7a2b;
        --hid-b: #436e26;
        --hid-hover: #5f9437;
        --open-a: #2b2b33;
        --open-b: #25252c;
        --n1: #74a9ff;
        --n2: #6fd685;
        --n3: #ff7272;
        --n4: #c792ff;
        --n5: #ffb357;
        --n6: #4fdbe8;
        --n7: #e6e6ea;
        --n8: #a8a8b3;
      }
    }
    .game {
      max-width: 1020px;
    }
    .diffs {
      display: inline-flex;
      background: var(--surface);
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
      margin: 0 auto 14px;
    }
    .diffs button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      padding: 8px 16px;
      min-height: 40px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .diffs button[aria-pressed="true"] {
      background: var(--bg);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 auto 12px;
    }
    .hud .stat {
      min-width: 84px;
      padding: 6px 14px;
    }
    .face {
      appearance: none;
      border: 0;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--surface);
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      flex: none;
    }
    .face:hover {
      background: var(--surface-2);
    }
    .face:active {
      transform: scale(0.93);
    }
    .tools {
      margin: 0 auto 14px;
      align-items: center;
    }
    .tools .btn {
      min-height: 40px;
    }
    .flagmode[aria-pressed="true"] {
      background: var(--bad);
      color: #fff;
    }
    .best-line {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .scroller {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 6px 6px 14px;
    }
    .board {
      --cell: 32px;
      display: grid;
      width: max-content;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    .board.lost, .board.won {
      cursor: default;
    }
    .cell {
      width: var(--cell);
      height: var(--cell);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: calc(var(--cell) * 0.56);
      line-height: 1;
      background: var(--hid-a);
      cursor: pointer;
      position: relative;
      transition: background 0.12s;
    }
    .cell.alt {
      background: var(--hid-b);
    }
    .board:not(.lost):not(.won) .cell:not(.open):hover {
      background: var(--hid-hover);
    }
    .cell.open {
      background: var(--open-a);
      cursor: default;
      animation: open 0.22s ease-out backwards;
    }
    .cell.open.alt {
      background: var(--open-b);
    }
    .cell.open.num {
      cursor: pointer;
    }
    .cell.press {
      background: var(--hid-hover);
      filter: brightness(0.92);
    }
    @keyframes open {
      from { transform: scale(0.6); opacity: 0.2; }
      to { transform: scale(1); opacity: 1; }
    }
    .cell.flag::after {
      content: "🚩";
      font-size: calc(var(--cell) * 0.55);
      animation: plant 0.18s ease-out;
    }
    @keyframes plant {
      from { transform: translateY(-40%) scale(0.4); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .cell.mine::after {
      content: "💣";
      font-size: calc(var(--cell) * 0.55);
      animation: boom 0.3s ease-out backwards;
      animation-delay: var(--d, 0s);
    }
    @keyframes boom {
      from { transform: scale(0); }
      70% { transform: scale(1.25); }
      to { transform: scale(1); }
    }
    .cell.hit {
      background: var(--bad) !important;
    }
    .cell.wrong::after {
      content: "🚩";
      opacity: 0.5;
      font-size: calc(var(--cell) * 0.55);
    }
    .cell.wrong::before {
      content: "✕";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bad);
      font-size: calc(var(--cell) * 0.8);
      font-weight: 800;
      z-index: 1;
    }
    .n1 { color: var(--n1); }
    .n2 { color: var(--n2); }
    .n3 { color: var(--n3); }
    .n4 { color: var(--n4); }
    .n5 { color: var(--n5); }
    .n6 { color: var(--n6); }
    .n7 { color: var(--n7); }
    .n8 { color: var(--n8); }
    .board.shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }
    .banner {
      margin: 16px auto 0;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: rise 0.35s ease-out;
    }
    .banner strong {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .banner.win strong {
      color: var(--good);
    }
    .banner.lose strong {
      color: var(--bad);
    }
    @keyframes rise {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 14px auto 0;
      max-width: 520px;
    }
  </style>
</head>
<body>
  <nav class="topbar"><a class="back" href="../../../index.html">← all games</a></nav>
  <main class="game">
    <h1 class="game-title">Minesweeper</h1>
    <p class="lede">Clear every safe square. Numbers count the mines touching them.</p>
    <div class="diffs" role="group" aria-label="Difficulty">
      <button type="button" data-diff="easy" aria-pressed="true">Easy</button>
      <button type="button" data-diff="medium" aria-pressed="false">Medium</button>
      <button type="button" data-diff="hard" aria-pressed="false">Hard</button>
    </div>
    <div class="hud">
      <div class="stat"><div class="stat-value" id="mines">10</div><div class="stat-label">Mines</div></div>
      <button class="face" id="face" type="button" aria-label="New game">🙂</button>
      <div class="stat"><div class="stat-value" id="time">0</div><div class="stat-label">Time</div></div>
    </div>
    <div class="row tools">
      <button class="btn secondary flagmode" id="flagBtn" type="button" aria-pressed="false">🚩 Flag mode: off</button>
      <span class="best-line" id="bestLine">Best: –</span>
    </div>
    <div class="scroller" id="scroller">
      <div class="board" id="board"></div>
    </div>
    <div class="banner hidden" id="banner">
      <strong id="bannerTitle"></strong>
      <span id="bannerText"></span>
      <button class="btn" id="againBtn" type="button">Play again</button>
    </div>
    <p class="hint">Click to dig, right-click or long-press to flag. Click a number whose flags are all placed to clear around it.</p>
  </main>
  <script>
    const DIFFS = {
      easy: { rows: 9, cols: 9, mines: 10 },
      medium: { rows: 16, cols: 16, mines: 40 },
      hard: { rows: 16, cols: 30, mines: 99 }
    };
    const boardEl = document.getElementById("board");
    const scroller = document.getElementById("scroller");
    const minesEl = document.getElementById("mines");
    const timeEl = document.getElementById("time");
    const face = document.getElementById("face");
    const flagBtn = document.getElementById("flagBtn");
    const bestLine = document.getElementById("bestLine");
    const banner = document.getElementById("banner");
    const bannerTitle = document.getElementById("bannerTitle");
    const bannerText = document.getElementById("bannerText");
    const diffButtons = Array.from(document.querySelectorAll(".diffs button"));

    let diff = "easy";
    let rows = 9;
    let cols = 9;
    let mineCount = 10;
    let cells = [];
    let els = [];
    let placed = false;
    let state = "ready";
    let flags = 0;
    let opened = 0;
    let startAt = 0;
    let timerId = null;
    let flagMode = false;

    function readStore(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function writeStore(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }
    function bestKey() {
      return "hello-minesweeper-best-" + diff;
    }
    function getBest() {
      const v = Number(readStore(bestKey()));
      return isFinite(v) && v > 0 ? v : 0;
    }
    function showBest() {
      const b = getBest();
      bestLine.textContent = "Best " + diff + ": " + (b ? b + "s" : "–");
    }

    function availableWidth() {
      return Math.max(200, scroller.clientWidth - 12);
    }

    function minCell() {
      return window.matchMedia("(pointer: coarse)").matches ? 30 : 22;
    }

    function sizeCells() {
      const fit = Math.floor(availableWidth() / cols);
      const size = Math.max(minCell(), Math.min(40, fit));
      boardEl.style.setProperty("--cell", size + "px");
    }

    function neighbors(i) {
      const r = Math.floor(i / cols);
      const c = i % cols;
      const out = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push(nr * cols + nc);
        }
      }
      return out;
    }

    function newGame(nextDiff) {
      if (nextDiff) diff = nextDiff;
      const d = DIFFS[diff];
      rows = d.rows;
      cols = d.cols;
      mineCount = d.mines;
      if (cols > rows && availableWidth() < cols * minCell()) {
        rows = d.cols;
        cols = d.rows;
      }
      diffButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.diff === diff)));
      clearInterval(timerId);
      timerId = null;
      state = "ready";
      placed = false;
      flags = 0;
      opened = 0;
      timeEl.textContent = "0";
      face.textContent = "🙂";
      banner.classList.add("hidden");
      boardEl.className = "board";
      boardEl.style.gridTemplateColumns = "repeat(" + cols + ", var(--cell))";
      boardEl.innerHTML = "";
      cells = [];
      els = [];
      const frag = document.createDocumentFragment();
      for (let i = 0; i < rows * cols; i++) {
        cells.push({ mine: false, open: false, flag: false, n: 0 });
        const el = document.createElement("div");
        const r = Math.floor(i / cols);
        const c = i % cols;
        el.className = "cell" + ((r + c) % 2 ? " alt" : "");
        el.dataset.i = i;
        frag.appendChild(el);
        els.push(el);
      }
      boardEl.appendChild(frag);
      sizeCells();
      updateMines();
      showBest();
      scroller.scrollLeft = 0;
    }

    function placeMines(safe) {
      const banned = new Set([safe].concat(neighbors(safe)));
      const pool = [];
      for (let i = 0; i < cells.length; i++) if (!banned.has(i)) pool.push(i);
      for (let k = 0; k < mineCount; k++) {
        const j = k + Math.floor(Math.random() * (pool.length - k));
        const tmp = pool[k];
        pool[k] = pool[j];
        pool[j] = tmp;
        cells[pool[k]].mine = true;
      }
      for (let i = 0; i < cells.length; i++) {
        cells[i].n = neighbors(i).filter((j) => cells[j].mine).length;
      }
      placed = true;
    }

    function startTimer() {
      state = "playing";
      startAt = performance.now();
      timerId = setInterval(() => {
        timeEl.textContent = Math.min(999, Math.floor((performance.now() - startAt) / 1000));
      }, 250);
    }

    function updateMines() {
      minesEl.textContent = mineCount - flags;
    }

    function paintOpen(i, delay) {
      const cell = cells[i];
      const el = els[i];
      el.classList.add("open");
      el.classList.remove("flag");
      if (delay) el.style.animationDelay = delay + "ms";
      if (cell.n) {
        el.textContent = cell.n;
        el.classList.add("num", "n" + cell.n);
      }
    }

    function reveal(i) {
      if (state === "won" || state === "lost") return;
      if (!placed) {
        placeMines(i);
        startTimer();
      }
      const cell = cells[i];
      if (cell.open || cell.flag) return;
      if (cell.mine) {
        lose(i);
        return;
      }
      flood([i]);
      checkWin();
    }

    function flood(starts) {
      const queue = starts.map((s) => [s, 0]);
      let head = 0;
      while (head < queue.length) {
        const item = queue[head++];
        const i = item[0];
        const depth = item[1];
        const cell = cells[i];
        if (cell.open || cell.flag || cell.mine) continue;
        cell.open = true;
        opened++;
        paintOpen(i, Math.min(depth * 18, 400));
        if (cell.n === 0) {
          neighbors(i).forEach((j) => {
            if (!cells[j].open && !cells[j].flag) queue.push([j, depth + 1]);
          });
        }
      }
    }

    function chord(i) {
      const cell = cells[i];
      if (!cell.open || !cell.n || state !== "playing") return;
      const around = neighbors(i);
      const flagged = around.filter((j) => cells[j].flag).length;
      if (flagged !== cell.n) {
        around.forEach((j) => {
          if (!cells[j].open && !cells[j].flag) {
            els[j].classList.add("press");
            setTimeout(() => els[j].classList.remove("press"), 160);
          }
        });
        return;
      }
      const hidden = around.filter((j) => !cells[j].open && !cells[j].flag);
      const boom = hidden.find((j) => cells[j].mine);
      if (boom !== undefined) {
        lose(boom);
        return;
      }
      flood(hidden);
      checkWin();
    }

    function toggleFlag(i) {
      if (state === "won" || state === "lost") return;
      const cell = cells[i];
      if (cell.open) return;
      cell.flag = !cell.flag;
      flags += cell.flag ? 1 : -1;
      els[i].classList.toggle("flag", cell.flag);
      updateMines();
      if (navigator.vibrate) {
        try { navigator.vibrate(15); } catch (e) {}
      }
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
      return Math.max(1, Math.round((performance.now() - startAt) / 100) / 10);
    }

    function lose(i) {
      state = "lost";
      stopTimer();
      face.textContent = "😵";
      boardEl.classList.add("lost");
      const hr = Math.floor(i / cols);
      const hc = i % cols;
      cells.forEach((cell, j) => {
        const el = els[j];
        if (cell.mine && !cell.flag) {
          const r = Math.floor(j / cols);
          const c = j % cols;
          const dist = Math.hypot(r - hr, c - hc);
          el.style.setProperty("--d", (j === i ? 0 : Math.min(60 + dist * 35, 900)) + "ms");
          el.classList.add("mine");
        } else if (!cell.mine && cell.flag) {
          el.classList.remove("flag");
          el.classList.add("wrong");
        }
      });
      els[i].classList.add("hit");
      boardEl.classList.remove("shake");
      void boardEl.offsetWidth;
      boardEl.classList.add("shake");
      if (navigator.vibrate) {
        try { navigator.vibrate([40, 40, 80]); } catch (e) {}
      }
      bannerTitle.textContent = "Boom!";
      bannerText.textContent = "You cleared " + opened + " of " + (cells.length - mineCount) + " safe squares.";
      banner.className = "banner lose";
    }

    function checkWin() {
      if (opened !== cells.length - mineCount || state === "lost") return;
      state = "won";
      const secs = stopTimer();
      face.textContent = "😎";
      boardEl.classList.add("won");
      cells.forEach((cell, j) => {
        if (cell.mine && !cell.flag) {
          cell.flag = true;
          els[j].classList.add("flag");
        }
      });
      flags = mineCount;
      updateMines();
      const shown = Math.min(999, Math.floor(secs));
      timeEl.textContent = shown;
      const prev = getBest();
      const isBest = !prev || secs < prev;
      if (isBest) writeStore(bestKey(), String(secs));
      showBest();
      bannerTitle.textContent = isBest ? "New best time!" : "Cleared!";
      bannerText.textContent = "You swept " + diff + " in " + secs + "s" + (isBest || !prev ? "." : " · best is " + prev + "s.");
      banner.className = "banner win";
    }

    function cellIndex(target) {
      const el = target.closest && target.closest(".cell");
      if (!el || !boardEl.contains(el)) return -1;
      return Number(el.dataset.i);
    }

    let press = null;
    let longTimer = null;
    let suppressClick = false;
    let lastPointerType = "mouse";
    let pressedEls = [];

    function clearPressed() {
      pressedEls.forEach((el) => el.classList.remove("press"));
      pressedEls = [];
    }

    function showPressed(i) {
      clearPressed();
      const cell = cells[i];
      if (cell.open && cell.n) {
        neighbors(i).forEach((j) => {
          if (!cells[j].open && !cells[j].flag) pressedEls.push(els[j]);
        });
      } else if (!cell.open && !cell.flag) {
        pressedEls.push(els[i]);
      }
      pressedEls.forEach((el) => el.classList.add("press"));
    }

    function endPress() {
      clearTimeout(longTimer);
      longTimer = null;
      press = null;
      clearPressed();
      if (state === "ready" || state === "playing") face.textContent = "🙂";
    }

    boardEl.addEventListener("pointerdown", (e) => {
      lastPointerType = e.pointerType;
      if (e.button !== 0) return;
      const i = cellIndex(e.target);
      if (i < 0 || state === "won" || state === "lost") return;
      suppressClick = false;
      press = { i: i, x: e.clientX, y: e.clientY, id: e.pointerId };
      face.textContent = "😮";
      showPressed(i);
      if (e.pointerType !== "mouse") {
        longTimer = setTimeout(() => {
          longTimer = null;
          if (!press) return;
          suppressClick = true;
          const idx = press.i;
          endPress();
          if (flagMode && !cells[idx].open) reveal(idx);
          else toggleFlag(idx);
        }, 400);
      }
    });

    boardEl.addEventListener("pointermove", (e) => {
      if (!press || e.pointerId !== press.id) return;
      if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) {
        endPress();
      }
    });

    boardEl.addEventListener("pointerup", () => {
      clearTimeout(longTimer);
      longTimer = null;
      clearPressed();
      if (state === "ready" || state === "playing") face.textContent = "🙂";
    });
    boardEl.addEventListener("pointercancel", endPress);
    boardEl.addEventListener("pointerleave", (e) => {
      if (e.pointerType === "mouse") endPress();
    });

    boardEl.addEventListener("click", (e) => {
      const i = cellIndex(e.target);
      const wasPress = press && press.i === i;
      press = null;
      if (suppressClick) {
        suppressClick = false;
        return;
      }
      if (i < 0 || !wasPress) return;
      const cell = cells[i];
      if (cell.open) {
        chord(i);
      } else if (flagMode) {
        if (!placed) reveal(i);
        else toggleFlag(i);
      } else {
        reveal(i);
      }
    });

    boardEl.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      if (lastPointerType !== "mouse") return;
      const i = cellIndex(e.target);
      if (i < 0) return;
      if (cells[i].open) chord(i);
      else toggleFlag(i);
    });

    boardEl.addEventListener("auxclick", (e) => {
      if (e.button !== 1) return;
      const i = cellIndex(e.target);
      if (i >= 0) chord(i);
    });

    face.addEventListener("click", () => newGame());
    document.getElementById("againBtn").addEventListener("click", () => newGame());
    diffButtons.forEach((b) => b.addEventListener("click", () => newGame(b.dataset.diff)));
    flagBtn.addEventListener("click", () => {
      flagMode = !flagMode;
      flagBtn.setAttribute("aria-pressed", String(flagMode));
      flagBtn.textContent = "🚩 Flag mode: " + (flagMode ? "on" : "off");
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(sizeCells, 100);
    });

    let saved = readStore("hello-minesweeper-diff");
    newGame(DIFFS[saved] ? saved : "easy");
    diffButtons.forEach((b) => b.addEventListener("click", () => writeStore("hello-minesweeper-diff", b.dataset.diff)));
  </script>
</body>
</html>
