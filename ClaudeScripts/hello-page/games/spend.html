<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spend a Hundred Billion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common.css">
  <style>
    .game { max-width: 1040px; }
    .money {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -16px 20px;
      padding: 12px 16px;
      background: linear-gradient(90deg, #1a9a55, #16b56a);
      color: #fff;
      box-shadow: var(--shadow);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .money-value {
      font-size: clamp(1.4rem, 6.4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .money-sub {
      font-size: 0.85rem;
      opacity: 0.92;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .money.broke { background: linear-gradient(90deg, #e0393e, #f0565a); }
    .money.pulse .money-value { animation: pulse 0.3s; }
    @keyframes pulse {
      50% { transform: scale(1.04); }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .item {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
    }
    .item.owned { border-color: color-mix(in srgb, var(--good) 55%, transparent); }
    .item.pop { animation: pop 0.25s; }
    @keyframes pop {
      40% { transform: scale(1.04); }
    }
    .icon {
      font-size: 2.6rem;
      line-height: 1.2;
      user-select: none;
    }
    .name {
      font-weight: 600;
      line-height: 1.25;
      min-height: 2.5em;
      display: flex;
      align-items: center;
    }
    .price {
      color: var(--good);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: 100%;
    }
    .controls .btn {
      padding: 8px 0;
      min-height: 40px;
      font-size: 0.9rem;
    }
    .controls .sell { background: #e0393e; color: #fff; }
    .controls .buy { background: #1a9a55; color: #fff; }
    .qty {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
      padding: 0 2px;
      -moz-appearance: textfield;
    }
    .qty::-webkit-outer-spin-button, .qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .qty:focus { outline: none; border-color: var(--accent); }
    .receipt {
      margin: 32px auto 0;
      max-width: 460px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px 20px;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }
    .receipt h2 {
      text-align: center;
      margin: 0 0 12px;
      font-size: 1.3rem;
      font-weight: 800;
    }
    .receipt .line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
    }
    .receipt .line span:first-child { min-width: 0; overflow-wrap: anywhere; }
    .receipt .line span:last-child { font-weight: 600; white-space: nowrap; }
    .receipt .total {
      border-top: 2px dashed var(--border);
      margin-top: 8px;
      padding-top: 10px;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .receipt .empty { color: var(--muted); text-align: center; }
    .receipt .actions { text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <nav class="topbar"><a class="back" href="../../../index.html">← all games</a></nav>
  <main class="game">
    <h1 class="game-title">Spend a Hundred Billion</h1>
    <p class="lede">You just got $100,000,000,000. Go shopping until there's nothing left.</p>
    <div class="money" id="money">
      <div class="money-value" id="moneyValue">$100,000,000,000</div>
      <div class="money-sub" id="moneySub">You've spent 0% of your fortune</div>
    </div>
    <div class="grid" id="grid"></div>
    <section class="receipt" id="receipt"></section>
  </main>
  <script>
    const START = 100000000000;
    const KEY = "hello-spend-cart";
    const ITEMS = [
      ["🍔", "Fast Food Burger", 2],
      ["🩴", "Flip Flops", 3],
      ["🧋", "Bubble Tea", 6],
      ["🎟️", "Movie Ticket", 12],
      ["📚", "Paperback Book", 15],
      ["🦞", "Lobster Dinner", 45],
      ["🎮", "Video Game", 70],
      ["👟", "Fancy Sneakers", 160],
      ["🎧", "Headphones", 350],
      ["🕹️", "Game Console", 500],
      ["📱", "Smartphone", 999],
      ["🐶", "Puppy", 1500],
      ["💻", "Gaming PC", 2500],
      ["🛵", "Jet Ski", 12000],
      ["⌚", "Luxury Watch", 30000],
      ["🚗", "Family Car", 35000],
      ["💍", "Diamond Ring", 60000],
      ["🚜", "Tractor", 150000],
      ["🐎", "Racehorse", 300000],
      ["🏠", "House", 420000],
      ["🏎️", "Supercar", 3000000],
      ["🚁", "Helicopter", 4000000],
      ["📺", "Super Bowl Ad", 7000000],
      ["🏰", "Mansion", 45000000],
      ["🏝️", "Private Island", 60000000],
      ["🚀", "Rocket Launch", 67000000],
      ["🛩️", "Private Jet", 75000000],
      ["🛥️", "Superyacht", 300000000],
      ["✈️", "Jumbo Jet", 400000000],
      ["🏙️", "Skyscraper", 850000000],
      ["🖼️", "Famous Painting", 900000000],
      ["🛳️", "Cruise Ship", 1200000000],
      ["🏟️", "Football Stadium", 1800000000],
      ["🏁", "Formula 1 Team", 2500000000],
      ["🏀", "Basketball Team", 4000000000],
      ["⚽", "Soccer Club", 5000000000]
    ].map(([icon, name, price], id) => ({ id, icon, name, price }));

    const grid = document.getElementById("grid");
    const moneyEl = document.getElementById("money");
    const moneyValue = document.getElementById("moneyValue");
    const moneySub = document.getElementById("moneySub");
    const receipt = document.getElementById("receipt");
    const fmt = (n) => "$" + Math.round(n).toLocaleString("en-US");

    let qty = ITEMS.map(() => 0);
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if (Array.isArray(saved) && saved.length === ITEMS.length) {
        const q = saved.map((v) => Math.max(0, Math.floor(Number(v) || 0)));
        if (q.reduce((a, v, i) => a + v * ITEMS[i].price, 0) <= START) qty = q;
      }
    } catch (e) {}

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(qty)); } catch (e) {}
    }

    const spent = () => qty.reduce((a, q, i) => a + q * ITEMS[i].price, 0);
    const left = () => START - spent();

    const cardEls = ITEMS.map((it) => {
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML =
        "<div class=\"icon\"></div><div class=\"name\"></div><div class=\"price\"></div>" +
        "<div class=\"controls\"><button class=\"btn sell\">Sell</button>" +
        "<input class=\"qty\" type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"1\" value=\"0\">" +
        "<button class=\"btn buy\">Buy</button></div>";
      el.querySelector(".icon").textContent = it.icon;
      el.querySelector(".name").textContent = it.name;
      el.querySelector(".price").textContent = fmt(it.price);
      const input = el.querySelector(".qty");
      input.setAttribute("aria-label", it.name + " quantity");
      el.querySelector(".sell").addEventListener("click", () => setQty(it.id, qty[it.id] - 1));
      el.querySelector(".buy").addEventListener("click", () => setQty(it.id, qty[it.id] + 1));
      input.addEventListener("input", () => {
        if (input.value === "") return;
        setQty(it.id, Math.floor(Number(input.value) || 0), true);
      });
      input.addEventListener("blur", () => { input.value = qty[it.id]; });
      input.addEventListener("focus", () => input.select());
      grid.appendChild(el);
      return el;
    });

    function setQty(id, n, fromInput) {
      const it = ITEMS[id];
      const others = spent() - qty[id] * it.price;
      const max = Math.floor((START - others) / it.price);
      n = Math.max(0, Math.min(max, n));
      const changed = n !== qty[id];
      qty[id] = n;
      const el = cardEls[id];
      const input = el.querySelector(".qty");
      if (!fromInput || Number(input.value) !== n) input.value = n;
      if (changed) {
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
        moneyEl.classList.remove("pulse");
        void moneyEl.offsetWidth;
        moneyEl.classList.add("pulse");
      }
      save();
      refresh();
    }

    let shown = left();
    let target = shown;
    let from = shown;
    let t0 = 0;
    let anim = null;

    function animateMoney() {
      from = shown;
      t0 = performance.now();
      if (anim) return;
      const step = (t) => {
        const p = Math.min(1, (t - t0) / 650);
        const e = 1 - Math.pow(1 - p, 3);
        shown = from + (target - from) * e;
        if (p >= 1) shown = target;
        moneyValue.textContent = fmt(shown);
        if (shown === target) { anim = null; return; }
        anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    }

    function refresh() {
      const l = left();
      target = l;
      animateMoney();
      const pct = (spent() / START) * 100;
      const pctText = pct === 0 ? "0" : pct < 0.001 ? "less than 0.001" : pct < 1 ? pct.toFixed(3) : pct.toFixed(2);
      moneySub.textContent = l === 0 ? "Congratulations, you spent it all! 🎉" : "You've spent " + pctText + "% of your fortune";
      moneyEl.classList.toggle("broke", l === 0);
      ITEMS.forEach((it, i) => {
        const el = cardEls[i];
        el.querySelector(".sell").disabled = qty[i] === 0;
        el.querySelector(".buy").disabled = it.price > l;
        el.classList.toggle("owned", qty[i] > 0);
        const input = el.querySelector(".qty");
        if (document.activeElement !== input) input.value = qty[i];
      });
      renderReceipt();
    }

    function renderReceipt() {
      const lines = ITEMS.filter((it, i) => qty[it.id] > 0);
      receipt.innerHTML = "<h2>Your Receipt</h2>";
      if (!lines.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "Nothing yet. Start buying things!";
        receipt.appendChild(p);
        return;
      }
      lines.forEach((it) => {
        const row = document.createElement("div");
        row.className = "line";
        const a = document.createElement("span");
        a.textContent = it.icon + " " + it.name + " × " + qty[it.id].toLocaleString("en-US");
        const b = document.createElement("span");
        b.textContent = fmt(qty[it.id] * it.price);
        row.append(a, b);
        receipt.appendChild(row);
      });
      const total = document.createElement("div");
      total.className = "line total";
      const ta = document.createElement("span");
      ta.textContent = "Total";
      const tb = document.createElement("span");
      tb.textContent = fmt(spent());
      total.append(ta, tb);
      receipt.appendChild(total);
      const actions = document.createElement("div");
      actions.className = "actions";
      const reset = document.createElement("button");
      reset.className = "btn secondary";
      reset.textContent = "Return everything";
      reset.addEventListener("click", () => {
        qty = ITEMS.map(() => 0);
        save();
        refresh();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      actions.appendChild(reset);
      receipt.appendChild(actions);
    }

    moneyValue.textContent = fmt(shown);
    refresh();
  </script>
</body>
</html>
