<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Password Gauntlet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../common.css">
  <style>
    .game { text-align: left; }
    .game-title, .lede { text-align: center; }
    .field {
      position: relative;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px 30px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .field.won { border-color: var(--good); }
    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    #pw {
      display: block;
      width: 100%;
      min-height: 3.2em;
      border: 0;
      outline: none;
      resize: none;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: clamp(1.25rem, 5vw, 1.6rem);
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
      padding: 0;
    }
    .count {
      position: absolute;
      right: 14px;
      bottom: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .count.bump { animation: bump 0.25s; }
    @keyframes bump {
      50% { transform: scale(1.25); color: var(--accent); }
    }
    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 2px 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .bar {
      flex: 1;
      height: 8px;
      margin-left: 12px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--good);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(.2,.8,.2,1);
    }
    .rules {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .rule {
      border-radius: 12px;
      border: 2px solid var(--bad);
      background: color-mix(in srgb, var(--bad) 9%, var(--bg));
      overflow: hidden;
      transition: border-color 0.25s, background 0.25s;
      animation: drop 0.45s cubic-bezier(.2,1.3,.4,1);
    }
    .rule.ok {
      border-color: var(--good);
      background: color-mix(in srgb, var(--good) 9%, var(--bg));
    }
    .rule-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      background: #d63438;
      transition: background 0.25s;
    }
    .rule.ok .rule-head { background: #1a9a55; }
    .rule-body {
      padding: 10px 14px 12px;
      font-size: 1rem;
    }
    .rule-detail {
      margin-top: 4px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .chips span {
      background: var(--surface-2);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .math {
      display: inline-block;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 0 8px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    @keyframes drop {
      from { opacity: 0; transform: translateY(-14px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    .rule.shake { animation: shake 0.35s; }
    @keyframes shake {
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .win {
      margin: 18px 0;
      text-align: center;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px 16px;
      animation: drop 0.5s cubic-bezier(.2,1.3,.4,1);
    }
    .win h2 {
      margin: 0 0 4px;
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .win p { color: var(--muted); margin: 0 0 16px; }
    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }
    .confetti i {
      position: absolute;
      top: -20px;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); }
    }
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <nav class="topbar"><a class="back" href="../../../index.html">← all games</a></nav>
  <main class="game">
    <h1 class="game-title">The Password Gauntlet</h1>
    <p class="lede">Please choose a password. New rules appear as you satisfy the old ones.</p>
    <div class="field" id="field">
      <label for="pw">Password</label>
      <textarea id="pw" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="Type here…"></textarea>
      <div class="count" id="count">0</div>
    </div>
    <div class="win hidden" id="win">
      <h2>Your password is secure 🎉</h2>
      <p id="winText"></p>
      <button class="btn" id="again">Play again</button>
    </div>
    <div class="progress"><span id="progText">0 of 16 rules</span><div class="bar"><span id="progBar"></span></div></div>
    <div class="rules" id="rules"></div>
    <p class="hint">Numbers are read whole: 25 is twenty-five, not 2 and 5. Roman numerals are runs of capital I V X L C D M.</p>
  </main>
  <div class="confetti" id="confetti"></div>
  <script>
    const pw = document.getElementById("pw");
    const countEl = document.getElementById("count");
    const rulesEl = document.getElementById("rules");
    const field = document.getElementById("field");
    const winEl = document.getElementById("win");
    const winText = document.getElementById("winText");
    const progText = document.getElementById("progText");
    const progBar = document.getElementById("progBar");
    const confettiEl = document.getElementById("confetti");
    const BEST_KEY = "hello-password-wins";

    const MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
    const DAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
    const SPONSORS = ["pepsoda", "snackr", "glimmo"];
    const MOONS = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
    const ELEMENTS = "He Li Be Ne Na Mg Al Si Cl Ar Ca Sc Ti Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" ");
    const ROMAN = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };

    function chars(s) { return Array.from(s); }
    function numbers(s) { return (s.match(/[0-9]+/g) || []); }
    function digitSum(s) { return (s.match(/[0-9]/g) || []).reduce((a, d) => a + Number(d), 0); }
    function romanValue(run) {
      let total = 0;
      for (let i = 0; i < run.length; i++) {
        const v = ROMAN[run[i]];
        const next = ROMAN[run[i + 1]] || 0;
        total += v < next ? -v : v;
      }
      return total;
    }
    function romans(s) { return (s.match(/[IVXLCDM]+/g) || []).map(romanValue); }
    function isPrime(n) {
      if (n < 2) return false;
      for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
      return true;
    }
    function isLeap(n) { return n > 0 && n % 4 === 0 && (n % 100 !== 0 || n % 400 === 0); }
    function cap(w) { return w[0].toUpperCase() + w.slice(1); }
    function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])); }

    function makeMath() {
      const kind = Math.floor(Math.random() * 3);
      let a, b, op, ans;
      if (kind === 0) {
        a = 2 + Math.floor(Math.random() * 8);
        b = 2 + Math.floor(Math.random() * 8);
        op = "+";
        ans = a + b;
      } else if (kind === 1) {
        a = 2 + Math.floor(Math.random() * 3);
        b = 2 + Math.floor(Math.random() * 4);
        op = "×";
        ans = a * b;
      } else {
        a = 10 + Math.floor(Math.random() * 10);
        b = 2 + Math.floor(Math.random() * 7);
        op = "−";
        ans = a - b;
      }
      return { text: a + " " + op + " " + b, ans };
    }

    let today, math, revealed, won;

    function buildRules() {
      return [
        {
          html: () => "Your password must be at least 6 characters.",
          check: (s) => chars(s).length >= 6
        },
        {
          html: () => "Your password must include a number.",
          check: (s) => /[0-9]/.test(s)
        },
        {
          html: () => "Your password must include an uppercase letter.",
          check: (s) => /[A-Z]/.test(s)
        },
        {
          html: () => "Your password must include a special character.",
          check: (s) => /[^A-Za-z0-9\s]/u.test(s)
        },
        {
          html: () => "The digits in your password must add up to 25.",
          detail: (s) => "Right now they add up to " + digitSum(s) + ".",
          check: (s) => digitSum(s) === 25
        },
        {
          html: () => "Your password must include a month of the year.",
          check: (s) => MONTHS.some((m) => s.toLowerCase().includes(m))
        },
        {
          html: () => "Your password must include a Roman numeral.",
          check: (s) => /[IVXLCDM]/.test(s)
        },
        {
          html: () => "Your password must include one of our sponsors:<div class=\"chips\">" + SPONSORS.map((x) => "<span>" + x + "</span>").join("") + "</div>",
          check: (s) => SPONSORS.some((x) => s.toLowerCase().includes(x))
        },
        {
          html: () => "The Roman numerals in your password must multiply to 35.",
          detail: (s) => {
            const r = romans(s);
            if (!r.length) return "No Roman numerals found.";
            return "Found " + r.join(" × ") + " = " + r.reduce((a, b) => a * b, 1).toLocaleString("en-US") + ".";
          },
          check: (s) => {
            const r = romans(s);
            return r.length > 0 && r.reduce((a, b) => a * b, 1) === 35;
          }
        },
        {
          html: () => "Your password must include today's day of the week.",
          check: (s) => s.toLowerCase().includes(today)
        },
        {
          html: () => "Your password must include the two-letter symbol of a chemical element.",
          detail: () => "Case matters: Fe counts, fe and FE don't.",
          check: (s) => ELEMENTS.some((e) => s.includes(e))
        },
        {
          html: () => "Your password must include an emoji of a moon phase.<div class=\"chips\">" + MOONS.map((x) => "<span>" + x + "</span>").join("") + "</div>",
          check: (s) => MOONS.some((m) => s.includes(m))
        },
        {
          html: () => "The length of your password must be included in your password.",
          detail: (s) => "Your password is " + chars(s).length + " characters long.",
          check: (s) => numbers(s).some((n) => Number(n) === chars(s).length && n[0] !== "0")
        },
        {
          html: () => "Your password must include a leap year (a four-digit year).",
          check: (s) => numbers(s).some((n) => n.length === 4 && isLeap(Number(n)))
        },
        {
          html: () => "Your password must include the answer to <span class=\"math\">" + math.text + "</span>",
          check: (s) => numbers(s).some((n) => Number(n) === math.ans && n[0] !== "0")
        },
        {
          html: () => "The length of your password must be a prime number.",
          detail: (s) => {
            const n = chars(s).length;
            return n + (isPrime(n) ? " is prime." : " is not prime.");
          },
          check: (s) => isPrime(chars(s).length)
        }
      ];
    }

    let RULES = [];
    let cards = [];
    let lastOk = [];

    function addCard(i) {
      const r = RULES[i];
      const el = document.createElement("div");
      el.className = "rule";
      el.innerHTML = "<div class=\"rule-head\"><span class=\"mark\">✗</span><span>Rule " + (i + 1) + "</span></div><div class=\"rule-body\"><div>" + r.html() + "</div><div class=\"rule-detail\"></div></div>";
      rulesEl.prepend(el);
      cards[i] = el;
      lastOk[i] = null;
    }

    function update() {
      const s = pw.value;
      const len = chars(s).length;
      if (countEl.textContent !== String(len)) {
        countEl.textContent = len;
        countEl.classList.remove("bump");
        void countEl.offsetWidth;
        countEl.classList.add("bump");
      }
      if (len === 0 && revealed === 0) {
        render(s);
        return;
      }
      if (revealed === 0) {
        revealed = 1;
        addCard(0);
      }
      let guard = 0;
      while (revealed < RULES.length && RULES.slice(0, revealed).every((r) => r.check(s)) && guard++ < 50) {
        addCard(revealed);
        revealed++;
      }
      render(s);
    }

    function render(s) {
      let passing = 0;
      for (let i = 0; i < revealed; i++) {
        const ok = RULES[i].check(s);
        if (ok) passing++;
        const el = cards[i];
        el.classList.toggle("ok", ok);
        el.querySelector(".mark").textContent = ok ? "✓" : "✗";
        const d = el.querySelector(".rule-detail");
        const dt = RULES[i].detail ? RULES[i].detail(s) : "";
        if (d.textContent !== dt) d.textContent = dt;
        if (lastOk[i] === true && !ok) {
          el.classList.remove("shake");
          void el.offsetWidth;
          el.classList.add("shake");
        }
        lastOk[i] = ok;
      }
      const solved = revealed === RULES.length && passing === RULES.length;
      progText.textContent = (revealed ? passing : 0) + " of " + RULES.length + " rules";
      progBar.style.width = ((revealed ? passing : 0) / RULES.length * 100) + "%";
      if (solved && !won) win(s);
    }

    function autosize() {
      pw.style.height = "auto";
      pw.style.height = pw.scrollHeight + "px";
    }

    function loadWins() {
      try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; }
    }
    function saveWins(v) {
      try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
    }

    function win(s) {
      won = true;
      pw.readOnly = true;
      pw.blur();
      field.classList.add("won");
      const wins = loadWins() + 1;
      saveWins(wins);
      winText.textContent = chars(s).length + " characters of pure security. Passwords conquered: " + wins + ".";
      winEl.classList.remove("hidden");
      confetti();
      winEl.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function confetti() {
      const colors = ["#3b5bfd", "#1a9a55", "#e0393e", "#e6a100", "#b04df0", "#18b5c9"];
      confettiEl.innerHTML = "";
      for (let i = 0; i < 140; i++) {
        const c = document.createElement("i");
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[i % colors.length];
        c.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
        c.style.setProperty("--rot", (Math.random() * 1440 - 720) + "deg");
        c.style.animationDuration = (2 + Math.random() * 2.2) + "s";
        c.style.animationDelay = (Math.random() * 0.6) + "s";
        if (Math.random() < 0.3) c.style.borderRadius = "50%";
        confettiEl.appendChild(c);
      }
      setTimeout(() => { confettiEl.innerHTML = ""; }, 5200);
    }

    function start() {
      today = DAYS[new Date().getDay()];
      math = makeMath();
      RULES = buildRules();
      revealed = 0;
      won = false;
      cards = [];
      lastOk = [];
      rulesEl.innerHTML = "";
      pw.value = "";
      pw.readOnly = false;
      field.classList.remove("won");
      winEl.classList.add("hidden");
      autosize();
      update();
    }

    pw.addEventListener("input", () => {
      if (/[\r\n]/.test(pw.value)) pw.value = pw.value.replace(/[\r\n]+/g, "");
      autosize();
      update();
    });
    pw.addEventListener("keydown", (e) => { if (e.key === "Enter") e.preventDefault(); });
    window.addEventListener("resize", autosize);
    document.getElementById("again").addEventListener("click", () => {
      start();
      window.scrollTo({ top: 0, behavior: "smooth" });
      pw.focus();
    });
    start();
  </script>
</body>
</html>
