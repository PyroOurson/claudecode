<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmic Clicker</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    .game.wide {
      max-width: 1100px;
    }
    .cosmos {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
      gap: 20px;
      text-align: left;
      align-items: start;
    }
    .left {
      min-width: 0;
    }
    .left .stats {
      margin: 0 0 14px;
      gap: 12px 28px;
      text-align: center;
    }
    .stat-value.big {
      font-size: 2rem;
      line-height: 1.1;
    }
    .sky {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background: #1f2a44;
      color: #eef0f6;
      padding: 28px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .orb {
      position: relative;
      display: block;
      width: min(280px, 70vw);
      height: min(280px, 70vw);
      margin: 8px auto 14px;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .orb svg {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .orb:focus-visible {
      outline: 3px solid #f1d488;
      outline-offset: 2px;
    }
    .orb.squash {
      animation: squash 0.18s ease-out;
    }
    @keyframes squash {
      0% { transform: scale(1, 1); }
      40% { transform: scale(1.04, 0.94); }
      100% { transform: scale(1, 1); }
    }
    .status {
      position: relative;
      text-align: center;
      margin: 0;
      min-height: 1.45em;
      color: #c9cfdf;
      font-size: 0.95rem;
    }
    .left-foot {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }
    .shop {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px 16px;
      max-height: 640px;
      overflow-y: auto;
    }
    .shop-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin: 0 0 8px;
    }
    .shop-head h2 {
      font-size: 1.05rem;
      font-weight: 800;
      margin: 0;
    }
    .shop-head + .shop-head,
    .upgrades + .shop-head,
    .none + .shop-head {
      margin-top: 22px;
    }
    .seg {
      display: flex;
      gap: 6px;
    }
    .seg button {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      min-width: 48px;
      min-height: 40px;
      cursor: pointer;
    }
    .seg button:hover {
      background: var(--surface);
    }
    .seg button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    .cols, .upg, .gen {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 6.8rem 3rem;
      gap: 8px;
      align-items: center;
    }
    .cols {
      font-size: 0.8rem;
      color: var(--muted);
      padding: 0 8px 6px;
      border-bottom: 1px solid var(--border);
    }
    .cols span:nth-child(n+2), .cs, .own {
      text-align: right;
    }
    .none {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
      padding: 10px 8px;
      border-top: 1px solid var(--border);
    }
    .upgrades {
      border-top: 1px solid var(--border);
    }
    .upg, .gen {
      appearance: none;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      padding: 10px 8px;
      min-height: 56px;
      cursor: pointer;
    }
    .upg:hover:not(.cant), .gen:hover:not(.cant) {
      background: var(--surface);
    }
    .upg:focus-visible, .gen:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .upg.cant, .gen.cant {
      cursor: not-allowed;
    }
    .upg.cant .nm, .gen.cant .nm, .upg.cant .cs, .gen.cant .cs {
      color: var(--muted);
    }
    .mid {
      min-width: 0;
    }
    .mid span {
      display: block;
    }
    .nm {
      font-weight: 700;
      line-height: 1.25;
    }
    .ds {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.3;
    }
    .cs {
      font-size: 0.9rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .own {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .gen.locked .nm {
      color: var(--muted);
    }
    .gen.bought, .upg.bought {
      animation: bought 0.3s linear;
    }
    @keyframes bought {
      0% { background: var(--surface-2); }
      100% { background: transparent; }
    }
    @media (max-width: 820px) {
      .cosmos {
        grid-template-columns: minmax(0, 1fr);
      }
      .shop {
        max-height: none;
        overflow: visible;
      }
    }
    @media (max-width: 420px) {
      .shop {
        padding: 12px 10px 14px;
      }
      .cols, .upg, .gen {
        grid-template-columns: minmax(0, 1fr) 6rem 2.8rem;
      }
    }
  </style>
</head>
<body>
  <nav class="topbar"><a class="logo" href="../../../index.html">hello</a></nav>
  <main class="game wide">
    <h1 class="game-title">Cosmic Clicker</h1>
    <p class="lede">Click the planet for stardust, then buy generators that collect it for you.</p>
    <div class="cosmos">
      <section class="left">
        <div class="stats">
          <div class="stat"><div class="stat-value big" id="dust">0</div><div class="stat-label">Stardust</div></div>
          <div class="stat"><div class="stat-value" id="pps">0</div><div class="stat-label">Per second</div></div>
          <div class="stat"><div class="stat-value" id="ppc">1</div><div class="stat-label">Per click</div></div>
          <div class="stat"><div class="stat-value" id="totalLine">0</div><div class="stat-label">All time</div></div>
        </div>
        <div class="sky" id="sky">
          <svg class="stars" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <g fill="#c9cfdf">
              <circle cx="40" cy="52" r="2"/>
              <circle cx="96" cy="300" r="1.5"/>
              <circle cx="150" cy="30" r="1.5"/>
              <circle cx="330" cy="70" r="2"/>
              <circle cx="372" cy="210" r="1.5"/>
              <circle cx="352" cy="300" r="2"/>
              <circle cx="24" cy="220" r="1.5"/>
              <circle cx="384" cy="372" r="1.5"/>
              <circle cx="262" cy="22" r="1.5"/>
              <circle cx="18" cy="330" r="2"/>
            </g>
            <g fill="#f1d488">
              <path d="M352 140 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
              <path d="M62 140 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
            </g>
          </svg>
          <button class="orb" id="orb" type="button" aria-label="Collect stardust">
            <svg viewBox="0 0 240 240" aria-hidden="true">
              <defs>
                <clipPath id="planetClip"><circle cx="120" cy="120" r="70"/></clipPath>
                <clipPath id="frontClip"><rect x="0" y="120" width="240" height="120"/></clipPath>
              </defs>
              <g transform="rotate(-16 120 120)">
                <ellipse cx="120" cy="120" rx="108" ry="28" fill="none" stroke="#1b1b1b" stroke-width="15"/>
                <ellipse cx="120" cy="120" rx="108" ry="28" fill="none" stroke="#f1d488" stroke-width="9"/>
              </g>
              <circle cx="120" cy="120" r="70" fill="#ef8f3a"/>
              <g clip-path="url(#planetClip)">
                <circle cx="120" cy="120" r="70" fill="#cf6427"/>
                <circle cx="131" cy="110" r="68" fill="#ef8f3a"/>
                <path d="M40 92 C80 80 150 104 200 88 L200 106 C150 122 80 98 40 110 Z" fill="#dd7630"/>
                <path d="M40 150 C90 140 140 162 200 146 L200 158 C140 174 90 152 40 162 Z" fill="#dd7630"/>
                <circle cx="150" cy="128" r="9" fill="#dd7630"/>
                <circle cx="96" cy="132" r="5" fill="#dd7630"/>
              </g>
              <circle cx="120" cy="120" r="70" fill="none" stroke="#1b1b1b" stroke-width="3"/>
              <g transform="rotate(-16 120 120)">
                <g clip-path="url(#frontClip)">
                  <ellipse cx="120" cy="120" rx="108" ry="28" fill="none" stroke="#1b1b1b" stroke-width="15"/>
                  <ellipse cx="120" cy="120" rx="108" ry="28" fill="none" stroke="#f1d488" stroke-width="9"/>
                </g>
              </g>
            </svg>
          </button>
          <p class="status" id="milestone" role="status" aria-live="polite">Click the planet to collect stardust.</p>
        </div>
        <div class="left-foot">
          <button class="btn secondary" id="reset" type="button">Reset</button>
        </div>
      </section>
      <section class="shop">
        <div class="shop-head"><h2>Upgrades</h2></div>
        <div class="upgrades" id="upgrades"></div>
        <p class="none" id="noUpg">None available yet.</p>
        <div class="shop-head">
          <h2>Generators</h2>
          <div class="seg" id="seg" role="group" aria-label="Buy amount">
            <button type="button" data-n="1" class="on">×1</button>
            <button type="button" data-n="10">×10</button>
            <button type="button" data-n="100">×100</button>
          </div>
        </div>
        <div class="cols" aria-hidden="true"><span>Generator</span><span>Cost</span><span>Owned</span></div>
        <div class="gens" id="gens"></div>
      </section>
    </div>
  </main>
  <script>
    const KEY = "hello-clicker-save";
    const OFFLINE_CAP = 8 * 3600;
    const GENS = [
      { id: "probe", name: "Space Probe", base: 15, rate: 0.1, desc: "Drifts about scooping up specks." },
      { id: "satellite", name: "Satellite", base: 100, rate: 1, desc: "Orbits with a very small net." },
      { id: "moonbase", name: "Moon Base", base: 1100, rate: 8, desc: "Sweeps up moondust." },
      { id: "miner", name: "Asteroid Miner", base: 12000, rate: 47, desc: "Cracks open asteroids." },
      { id: "dyson", name: "Dyson Swarm", base: 130000, rate: 260, desc: "Panels wrapped around a sun." },
      { id: "forge", name: "Star Forge", base: 1400000, rate: 1400, desc: "Makes new stars." },
      { id: "nebula", name: "Nebula Refinery", base: 20000000, rate: 7800, desc: "Refines gas clouds." },
      { id: "harvester", name: "Galaxy Harvester", base: 330000000, rate: 44000, desc: "Combs whole spiral arms." },
      { id: "wormhole", name: "Wormhole", base: 5100000000, rate: 260000, desc: "Borrows stardust from elsewhere." },
      { id: "printer", name: "Universe Printer", base: 75000000000, rate: 1600000, desc: "Prints new universes. Low on ink." }
    ];
    const UPGS = [
      { id: "gloves", name: "Stardust Gloves", cost: 100, desc: "Clicks are twice as strong.", unlock: () => state.total >= 50, click: 2 },
      { id: "antennas", name: "Probe Antennas", cost: 750, desc: "Space Probes gather twice as much.", unlock: () => owned("probe") >= 5, gen: "probe", mult: 2 },
      { id: "panels", name: "Solar Panels", cost: 5000, desc: "Satellites gather twice as much.", unlock: () => owned("satellite") >= 5, gen: "satellite", mult: 2 },
      { id: "gauntlet", name: "Gravity Gauntlet", cost: 25000, desc: "Clicks are twice as strong again.", unlock: () => state.total >= 10000, click: 2 },
      { id: "cheese", name: "Moon Cheese Drills", cost: 60000, desc: "Moon Bases gather twice as much.", unlock: () => owned("moonbase") >= 5, gen: "moonbase", mult: 2 },
      { id: "touch", name: "Cosmic Touch", cost: 150000, desc: "Each click also adds 2% of your per-second rate.", unlock: () => state.total >= 60000, share: 0.02 },
      { id: "magnets", name: "Asteroid Magnets", cost: 600000, desc: "Asteroid Miners gather twice as much.", unlock: () => owned("miner") >= 5, gen: "miner", mult: 2 },
      { id: "mirrors", name: "Dyson Mirrors", cost: 6500000, desc: "Dyson Swarms gather twice as much.", unlock: () => owned("dyson") >= 5, gen: "dyson", mult: 2 },
      { id: "hammers", name: "Neutron Hammers", cost: 70000000, desc: "Star Forges gather twice as much.", unlock: () => owned("forge") >= 5, gen: "forge", mult: 2 },
      { id: "darkmatter", name: "Dark Matter Engine", cost: 50000000, desc: "Everything gathers 50% more.", unlock: () => state.total >= 20000000, all: 1.5 }
    ];
    const MILESTONES = [
      [10, "a pinch of dust"],
      [100, "a pebble"],
      [1000, "a boulder"],
      [10000, "a mountain"],
      [100000, "an asteroid"],
      [1000000, "a moon"],
      [10000000, "a small planet"],
      [100000000, "a gas giant"],
      [1000000000, "a star"],
      [10000000000, "a solar system"],
      [100000000000, "a nebula"],
      [1000000000000, "a star cluster"],
      [10000000000000, "a galaxy"],
      [1000000000000000, "a galaxy cluster"],
      [1000000000000000000, "a universe"]
    ];
    const NAMES = ["million", "billion", "trillion", "quadrillion", "quintillion", "sextillion", "septillion", "octillion", "nonillion", "decillion"];
    const START_TEXT = "Click the planet to collect stardust.";

    function fresh() {
      return { dust: 0, total: 0, clicks: 0, owned: {}, upgrades: [], milestone: -1, last: Date.now() };
    }
    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return fresh();
        const s = JSON.parse(raw);
        const f = fresh();
        if (!s || typeof s !== "object") return f;
        f.dust = Number(s.dust) || 0;
        f.total = Math.max(Number(s.total) || 0, f.dust);
        f.clicks = Number(s.clicks) || 0;
        f.owned = s.owned && typeof s.owned === "object" ? s.owned : {};
        f.upgrades = Array.isArray(s.upgrades) ? s.upgrades : [];
        f.milestone = Number.isFinite(s.milestone) ? s.milestone : -1;
        f.last = Number(s.last) || Date.now();
        return f;
      } catch (e) {
        return fresh();
      }
    }
    function save() {
      state.last = Date.now();
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    let state = load();

    function owned(id) { return Number(state.owned[id]) || 0; }
    function has(id) { return state.upgrades.includes(id); }

    function fmt(n, decimals) {
      if (!Number.isFinite(n)) return "∞";
      if (n < 1e6) {
        if (decimals && n < 100 && Math.abs(n - Math.round(n)) > 1e-9) return n.toFixed(1);
        return Math.floor(n).toLocaleString("en-US");
      }
      let i = Math.floor(Math.log10(n) / 3) - 2;
      let v = n / Math.pow(1000, i + 2);
      if (v >= 999.995) { i++; v /= 1000; }
      if (i >= NAMES.length) return n.toExponential(2).replace("e+", "e");
      return v.toFixed(2) + " " + NAMES[i];
    }

    function genMult(g) {
      let m = 1;
      UPGS.forEach((u) => {
        if (!has(u.id)) return;
        if (u.gen === g.id) m *= u.mult;
        if (u.all) m *= u.all;
      });
      return m;
    }
    function perSecond() {
      return GENS.reduce((sum, g) => sum + owned(g.id) * g.rate * genMult(g), 0);
    }
    function perClick() {
      let c = 1;
      let share = 0;
      UPGS.forEach((u) => {
        if (!has(u.id)) return;
        if (u.click) c *= u.click;
        if (u.share) share += u.share;
      });
      return c + perSecond() * share;
    }
    function costOf(g, n) {
      const k = owned(g.id);
      return Math.ceil(g.base * Math.pow(1.15, k) * (Math.pow(1.15, n) - 1) / 0.15);
    }

    const dustEl = document.getElementById("dust");
    const ppsEl = document.getElementById("pps");
    const ppcEl = document.getElementById("ppc");
    const totalLine = document.getElementById("totalLine");
    const orb = document.getElementById("orb");
    const milestoneEl = document.getElementById("milestone");
    const gensEl = document.getElementById("gens");
    const upgEl = document.getElementById("upgrades");
    const noUpg = document.getElementById("noUpg");
    let buyN = 1;

    function note(text) {
      milestoneEl.textContent = text;
    }

    function earn(x) {
      state.dust += x;
      state.total += x;
    }

    function milestoneText(i) {
      return "Enough stardust for " + MILESTONES[i][1] + ".";
    }
    function checkMilestones() {
      let i = state.milestone;
      while (i + 1 < MILESTONES.length && state.total >= MILESTONES[i + 1][0]) i++;
      if (i !== state.milestone) {
        state.milestone = i;
        note(milestoneText(i));
      }
    }

    function clickOrb() {
      const gain = perClick();
      earn(gain);
      state.clicks++;
      orb.classList.remove("squash");
      void orb.offsetWidth;
      orb.classList.add("squash");
      checkMilestones();
      render();
    }
    orb.addEventListener("pointerdown", (e) => {
      if (e.button > 0) return;
      e.preventDefault();
      clickOrb();
    });
    orb.addEventListener("click", (e) => {
      if (e.detail === 0) clickOrb();
    });
    orb.addEventListener("keydown", (e) => {
      if (e.repeat && (e.key === "Enter" || e.key === " ")) e.preventDefault();
    });
    orb.addEventListener("animationend", () => orb.classList.remove("squash"));

    const genRows = {};
    function buildGens() {
      gensEl.textContent = "";
      GENS.forEach((g) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "gen";
        b.innerHTML = '<span class="mid"><span class="nm"></span><span class="ds"></span></span><span class="cs"></span><span class="own"></span>';
        b.addEventListener("click", () => buy(g));
        b.addEventListener("animationend", () => b.classList.remove("bought"));
        gensEl.appendChild(b);
        genRows[g.id] = {
          el: b,
          nm: b.querySelector(".nm"),
          ds: b.querySelector(".ds"),
          cs: b.querySelector(".cs"),
          own: b.querySelector(".own")
        };
      });
    }

    function buy(g) {
      const row = genRows[g.id];
      if (row.el.classList.contains("locked")) return;
      const c = costOf(g, buyN);
      if (state.dust < c) return;
      state.dust -= c;
      state.owned[g.id] = owned(g.id) + buyN;
      row.el.classList.remove("bought");
      void row.el.offsetWidth;
      row.el.classList.add("bought");
      render();
    }

    function revealed(i) {
      if (i === 0) return true;
      const g = GENS[i];
      return owned(g.id) > 0 || owned(GENS[i - 1].id) > 0 || state.total >= g.base * 0.5;
    }

    let upgSig = null;
    function renderUpgrades() {
      const avail = UPGS.filter((u) => !has(u.id) && u.unlock()).sort((a, b) => a.cost - b.cost);
      const sig = avail.map((u) => u.id).join(",");
      if (sig !== upgSig) {
        upgSig = sig;
        upgEl.textContent = "";
        avail.forEach((u) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "upg";
          b.dataset.id = u.id;
          b.innerHTML = '<span class="mid"><span class="nm"></span><span class="ds"></span></span><span class="cs"></span><span class="own"></span>';
          b.querySelector(".nm").textContent = u.name;
          b.querySelector(".ds").textContent = u.desc;
          b.querySelector(".cs").textContent = fmt(u.cost);
          b.addEventListener("click", () => {
            if (has(u.id) || state.dust < u.cost) return;
            state.dust -= u.cost;
            state.upgrades.push(u.id);
            note("Bought " + u.name + ".");
            render();
          });
          upgEl.appendChild(b);
        });
        noUpg.classList.toggle("hidden", avail.length > 0);
        upgEl.classList.toggle("hidden", avail.length === 0);
      }
      upgEl.querySelectorAll(".upg").forEach((b) => {
        const u = UPGS.find((x) => x.id === b.dataset.id);
        b.classList.toggle("cant", state.dust < u.cost);
      });
    }

    function render() {
      const pps = perSecond();
      dustEl.textContent = fmt(state.dust);
      ppsEl.textContent = fmt(pps, true);
      ppcEl.textContent = fmt(perClick(), true);
      totalLine.textContent = fmt(state.total);
      let shownLocked = false;
      GENS.forEach((g, i) => {
        const row = genRows[g.id];
        const show = revealed(i);
        if (!show && shownLocked) {
          row.el.classList.add("hidden");
          return;
        }
        row.el.classList.remove("hidden");
        const c = costOf(g, buyN);
        if (!show) {
          shownLocked = true;
          row.el.classList.add("locked", "cant");
          row.nm.textContent = "???";
          row.ds.textContent = "Keep collecting to reveal.";
          row.cs.textContent = fmt(c);
          row.own.textContent = "";
          return;
        }
        row.el.classList.remove("locked");
        row.el.classList.toggle("cant", state.dust < c);
        row.nm.textContent = buyN > 1 ? g.name + " ×" + buyN : g.name;
        const each = g.rate * genMult(g);
        row.ds.textContent = g.desc + " " + fmt(each, true) + "/s each.";
        row.cs.textContent = fmt(c);
        row.own.textContent = owned(g.id);
      });
      renderUpgrades();
    }

    function applyOffline() {
      const now = Date.now();
      const secs = Math.min(Math.max(0, (now - state.last) / 1000), OFFLINE_CAP);
      state.last = now;
      if (secs < 1) return "";
      const gain = perSecond() * secs;
      if (gain <= 0) return "";
      earn(gain);
      checkMilestones();
      if (secs >= 10 && gain >= 1) return "Earned " + fmt(gain) + " stardust while away.";
      return "";
    }

    document.getElementById("seg").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      buyN = Number(b.dataset.n);
      document.querySelectorAll("#seg button").forEach((x) => x.classList.toggle("on", x === b));
      render();
    });

    document.getElementById("reset").addEventListener("click", () => {
      if (!window.confirm("Reset your stardust, generators and upgrades?")) return;
      state = fresh();
      save();
      upgSig = null;
      note("Reset. " + START_TEXT);
      render();
    });

    let lastFrame = performance.now();
    let lastRender = 0;
    let lastSave = performance.now();
    function frame(t) {
      let dt = (t - lastFrame) / 1000;
      lastFrame = t;
      if (dt > 1) dt = 1;
      if (dt > 0) earn(perSecond() * dt);
      if (t - lastRender > 100) {
        lastRender = t;
        checkMilestones();
        render();
      }
      if (t - lastSave > 5000) {
        lastSave = t;
        save();
      }
      requestAnimationFrame(frame);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        save();
      } else {
        const msg = applyOffline();
        if (msg) note(msg);
        lastFrame = performance.now();
        render();
      }
    });
    window.addEventListener("pagehide", save);

    buildGens();
    if (state.milestone >= 0 && state.milestone < MILESTONES.length) note(milestoneText(state.milestone));
    const awayMsg = applyOffline();
    checkMilestones();
    if (awayMsg) note(awayMsg);
    render();
    requestAnimationFrame((t) => { lastFrame = t; requestAnimationFrame(frame); });
  </script>
</body>
</html>
