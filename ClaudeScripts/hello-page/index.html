<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #111;
      overflow: hidden;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 14vw, 9rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      display: flex;
    }
    h1 span {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.4em);
      filter: blur(12px);
      animation: rise 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    h1 span:nth-child(1) { animation-delay: 0.15s; }
    h1 span:nth-child(2) { animation-delay: 0.25s; }
    h1 span:nth-child(3) { animation-delay: 0.35s; }
    h1 span:nth-child(4) { animation-delay: 0.45s; }
    h1 span:nth-child(5) { animation-delay: 0.55s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      h1 span { animation: fade 0.8s ease forwards; transform: none; filter: none; }
      @keyframes fade { to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <h1 aria-label="hello"><span>h</span><span>e</span><span>l</span><span>l</span><span>o</span></h1>
</body>
</html>
