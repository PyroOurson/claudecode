[package]
name = "maps-demo-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
osmpbf = "0.3.8"
rayon = "1.12.0"
rstar = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
