  <link rel="stylesheet" href="ClaudeScripts/hello-page/common.css">
  <style>
    header {
      text-align: center;
      padding: clamp(40px, 8vw, 72px) 16px 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 1;
    }
    h1 span {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.3em);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    h1 span:nth-child(1) { animation-delay: 0.05s; }
    h1 span:nth-child(2) { animation-delay: 0.1s; }
    h1 span:nth-child(3) { animation-delay: 0.15s; }
    h1 span:nth-child(4) { animation-delay: 0.2s; }
    h1 span:nth-child(5) { animation-delay: 0.25s; }
    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
    .sub {
      margin: 12px 0 0;
      color: var(--muted);
    }
    .grid {
      list-style: none;
      margin: 0 auto;
      padding: 36px 16px 64px;
      max-width: 1040px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 36px 28px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: var(--text);
    }
    .card svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      transition: transform 0.15s ease-out;
    }
    .card:hover svg,
    .card:focus-visible svg {
      transform: translateY(-3px);
    }
    .card:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 6px;
      border-radius: 10px;
    }
    .card span {
      display: block;
      margin-top: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }
    @media (max-width: 820px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 26px 16px;
      }
    }
    @media (max-width: 380px) {
      .card span {
        font-size: 0.95rem;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      h1 span { opacity: 1; transform: none; animation: none; }
    }
  </style>
</head>
